# Sanitized Zabbix Agent 2 example

Server=<ZABBIX_SERVER_IP>
ServerActive=<ZABBIX_SERVER_IP>
Hostname=<UNIQUE_HOSTNAME>

Include=/etc/zabbix/zabbix_agent2.d/*.conf

# Permit TCP/10050 only from the monitoring server through host/network policy.
# Do not place API tokens, TLS private keys, or PSKs in this repository.
